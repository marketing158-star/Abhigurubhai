<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Telegram Channel</title>
    
    <!-- Meta Pixel Code -->
    <script>

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};

    n.queue=[];t=b.createElement(e);t.async=!0;

    <noscript>
        <img height="1" width="1" style="display:none" 
             src="https://www.facebook.com/tr?id=1560668258658280&ev=PageView&noscript=1"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #060713;
            background-image: 
                radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.25) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(255, 0, 127, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* VIP Cyber Card Outer Frame */
        .vip-card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(160deg, #ff007f, #7928ca, #00f2fe);
            border-radius: 26px;
            padding: 2.5px;
            box-shadow: 
                0 0 40px rgba(121, 40, 202, 0.5),
                0 20px 50px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .card-inner {
            background: #0b0d1e;
            border-radius: 24px;
            padding: 26px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Top Cyber Banner Badge */
        .top-tag {
            display: inline-block;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 18px;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            margin-bottom: 18px;
        }

        /* Profile Ring Neon */
        .avatar-box {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
        }

        .avatar-box::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #ff007f, #7928ca, #00f2fe);
            background-size: 300% 300%;
            animation: glowGradient 3s ease infinite;
        }

        @keyframes glowGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .profile-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0b0d1e;
            z-index: 1;
        }

        /* Title with Neon Gradient Text */
        h1 {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(90deg, #00f2fe, #ffffff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Subtext Box */
        .sub-text {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid #00f2fe;
            border-right: 3px solid #ff007f;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        /* Badge and Users Grid */
        .grid-stats {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
        }

        .stat-pill {
            flex: 1;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.25);
            color: #00f2fe;
            padding: 8px 6px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .stat-pill.users {
            background: rgba(255, 0, 127, 0.08);
            border-color: rgba(255, 0, 127, 0.25);
            color: #ff70ba;
        }

        /* Info List */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* Neon Animated Button */
        .cta-btn {
            background: linear-gradient(90deg, #ff007f, #7928ca, #00f2fe);
            background-size: 200% auto;
            color: #ffffff;
            font-weight: 900;
            font-size: 15.5px;
            letter-spacing: 0.8px;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            animation: btnShift 3s infinite linear;
        }

        @keyframes btnShift {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .cta-btn:active {
            transform: scale(0.96);
        }

        /* Timer Badge */
        .timer-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 14px;
        }

        .footer-text {
            margin-top: 14px;
            font-size: 11px;
            color: #64748b;
        }

        .footer-text span {
            color: #ff007f;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="vip-card">
        <div class="card-inner">
            <!-- Top Tag -->
            <div class="top-tag">🔥 Official VIP Channel</div>

            <!-- प्रोफाइल फोटो -->
            <div class="avatar-box">
                <img src="profile.png" alt="Profile" class="profile-img">
            </div>

            <!-- हेडिंग -->
            <h1>👑 𝙂𝙐𝙍𝙐 𝘽𝙃𝘼𝙄 𝙎𝘼𝙏𝙏𝘼 𝙆𝙄𝙉𝙂
</h1>

            <!-- डिस्क्रिप्शन -->
            <p class="sub-text">
                डेली सिंगल जोड़ी फ्री मिलेगी। ख़बर सबसे पहले पाने के लिए टेलीग्राम चैनल ज्वाइन करें 👑
            </p>

            <!-- ग्रिड स्टैट्स -->
            <div class="grid-stats">
                <div class="stat-pill">⚡ ALL MATKA GAMES</div>
                <div class="stat-pill users">👥 40k+ JOINED</div>
            </div>

            <!-- इन्फो बॉक्स लिस्ट -->
            <div class="info-list">
                <div class="info-box">🤝 💎 फरीदाबाद, गाजियाबाद 💎</div>
                <div class="info-box">🤝 💎 गली , दिसावर 💎</div>
                <div class="info-box">📚 1001% FIX GAME MILEGA</div>
            </div>

            <!-- मुख्य टेलीग्राम बटन -->
            <button id="telegramLink" class="cta-btn" onclick="trackButtonClick()">
                🚀 JOIN TELEGRAM CHANNEL
            </button>

            <!-- टाइमर -->
            <div class="timer-badge" id="timer">
                ⏱ Redirecting in 30...
            </div>

            <!-- फुटर -->
            <div class="footer-text">Managed by <span>elite marketing</span></div>
        </div>
    </div>

    <script>
        var isClicked = false;
        var telegramUrl = "https://t.me/+yM6lBH3LorFkNGQ1"; 
        var pageLoadTime = Date.now();

        if (sessionStorage.getItem('hasClickedTelegram')) {
            isClicked = true;
        }

        function trackButtonClick() {
            var currentTime = Date.now();
            var timeSpent = (currentTime - pageLoadTime) / 1000;

            if (timeSpent < 0.8) {
                window.location.href = telegramUrl;
                return;
            }

            if (!isClicked) {
                isClicked = true;
                sessionStorage.setItem('hasClickedTelegram', 'true');

                if (typeof fbq !== 'undefined') {
                    fbq('trackCustom', 'TelegramBtnClick'); 
                    fbq('track', 'Subscribe'); 
                }

                var btn = document.getElementById('telegramLink');
                if (btn) {
                    btn.style.pointerEvents = 'none';
                    btn.style.opacity = '0.7';
                }

                setTimeout(function() {
                    window.location.href = telegramUrl;
                }, 300);
            } else {
                window.location.href = telegramUrl;
            }
        }

        var timeLeft = 30;
        var timerElement = document.getElementById('timer');
        var countdown = setInterval(function() {
            timeLeft--;
            if (timeLeft > 0) {
                timerElement.innerText = "⏱ Redirecting in " + timeLeft + "...";
            } else {
                clearInterval(countdown);
                timerElement.innerText = "⚡ Redirecting now...";
                trackButtonClick();
            }
        }, 1000);
    </script>

</body>
</html>
